<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/portfolio/favicon.svg" type="image/svg+xml">
<title>404 — Pagina niet gevonden | Bastiaan van der Horst</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --bg:#0a0f0d; --green:#2dd4a0; --green-bright:#4ae8b8; --gold:#e8b44f; --white:#f2f8f4; --text:#d7e4dc; --muted:#7e9489; --muted2:#a8bcb1; --border:rgba(45,212,160,0.14); }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; position:relative; overflow:hidden; }
body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(45,212,160,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(45,212,160,0.04) 1px,transparent 1px); background-size:56px 56px; pointer-events:none; }
.wrap { position:relative; z-index:1; max-width:520px; }
.code { font-family:'JetBrains Mono',monospace; font-size:0.82em; color:var(--gold); letter-spacing:0.14em; text-transform:uppercase; margin-bottom:18px; }
h1 { font-family:'Space Grotesk',sans-serif; font-size:clamp(4em,16vw,7em); font-weight:700; line-height:1; background:linear-gradient(100deg,var(--green-bright),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px; }
h2 { font-family:'Space Grotesk',sans-serif; color:var(--white); font-size:1.5em; margin-bottom:14px; }
p { color:var(--muted2); margin-bottom:14px; line-height:1.7; }
.quote { color:var(--muted); font-size:0.92em; font-style:italic; margin-bottom:32px; }
.btn { display:inline-block; background:var(--green); color:#07120d; padding:13px 28px; text-decoration:none; font-weight:600; border-radius:8px; transition:all 0.25s; }
.btn:hover { background:var(--green-bright); transform:translateY(-2px); }
.spark { margin:0 auto 30px; display:block; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="spark" width="200" height="70" viewBox="0 0 200 70">
      <polyline points="0,55 40,40 80,48 120,20 160,52 200,8" fill="none" stroke="#f0716e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="120" cy="20" r="5" fill="#f0716e"/>
    </svg>
    <div class="code">// error 404 · positie niet gevonden</div>
    <h1>404</h1>
    <h2>Deze pagina is gecorrigeerd uit de markt</h2>
    <p>De link die je volgde bestaat niet (meer). Geen paniek — de rest van de portefeuille presteert prima.</p>
    <p class="quote">"Cut your losses, let your winners run." — en deze loss knippen we hierbij.</p>
    <a href="/portfolio/" class="btn">← Terug naar de homepage</a>
  </div>
</body>
</html>
