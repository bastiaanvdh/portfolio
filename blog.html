<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>Blog | Bastiaan van der Horst</title>
<meta name="description" content="Analyses en build-logs van Bastiaan van der Horst: beleggen, data, automatisering en de tools die ik bouw.">
<meta name="author" content="Bastiaan van der Horst">
<link rel="canonical" href="https://bastiaanvdh.github.io/portfolio/blog.html">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bastiaanvdh.github.io/portfolio/blog.html">
<meta property="og:title" content="Blog — Analyses & build-logs">
<meta property="og:description" content="Hoe ik naar aandelen kijk, wat ik bouw en wat ik daarvan leer. Verlengstuk van Beleggen met Bastiaan.">
<meta property="og:image" content="https://bastiaanvdh.github.io/portfolio/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bastiaanvdh.github.io/portfolio/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root {
  --bg: #0a0f0d;
  --surface: #101713;
  --surface2: #16201a;
  --surface3: #1c2820;
  --green: #2dd4a0;
  --green-bright: #4ae8b8;
  --gold: #e8b44f;
  --gold-soft: #f2cd7e;
  --red: #f0716e;
  --white: #f2f8f4;
  --text: #d7e4dc;
  --muted: #7e9489;
  --muted2: #a8bcb1;
  --border: rgba(45, 212, 160, 0.14);
  --border-gold: rgba(232, 180, 79, 0.25);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  line-height: 1.65;
  overflow-x: hidden;
}
h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; color: var(--white); }
::selection { background: var(--green); color: var(--bg); }
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(45, 212, 160, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(45, 212, 160, 0.03) 1px, transparent 1px);
  background-size: 56px 56px;
  pointer-events: none;
  z-index: 0;
}
nav {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 15, 13, 0.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1140px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  padding: 0 max(40px, 4vw);
}
.nav-logo {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88em;
  color: var(--green);
  text-decoration: none;
  letter-spacing: 0.04em;
  font-weight: 700;
}
.nav-back {
  color: var(--muted2);
  text-decoration: none;
  font-size: 0.87em;
  font-weight: 500;
  transition: color 0.2s;
}
.nav-back:hover { color: var(--green-bright); }

.container {
  max-width: 860px;
  margin: 0 auto;
  padding: 56px max(40px, 4vw) 90px;
  position: relative;
  z-index: 1;
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78em;
  color: var(--green);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
h1 { font-size: clamp(1.9em, 4vw, 2.8em); letter-spacing: -0.02em; margin-bottom: 12px; }
.intro { color: var(--muted2); font-size: 1.05em; max-width: 640px; margin-bottom: 44px; line-height: 1.7; }

/* Post list */
.post-card {
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 30px 34px;
  margin-bottom: 18px;
  text-decoration: none;
  transition: all 0.25s;
  position: relative;
  overflow: hidden;
}
.post-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: 4px; height: 100%;
  background: linear-gradient(to bottom, var(--green), var(--gold));
}
.post-card:hover {
  border-color: rgba(45, 212, 160, 0.3);
  background: var(--surface2);
  transform: translateY(-2px);
}
.post-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76em;
  color: var(--muted);
  margin-bottom: 8px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.post-tag { color: var(--gold); }
.post-card h2 { font-size: 1.3em; margin-bottom: 8px; }
.post-card p { color: var(--muted2); font-size: 0.95em; }
.read-more {
  display: inline-block;
  margin-top: 14px;
  color: var(--green-bright);
  font-size: 0.88em;
  font-weight: 500;
}

/* Article view */
#article-view { display: none; }
.article-back {
  display: inline-block;
  color: var(--green-bright);
  text-decoration: none;
  font-size: 0.9em;
  margin-bottom: 28px;
  font-weight: 500;
}
.article-back:hover { color: var(--white); }
.article-meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8em;
  color: var(--muted);
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.article-content h1 { font-size: 2em; margin-bottom: 10px; }
.article-content h2 {
  font-size: 1.4em;
  margin: 38px 0 14px;
  padding-top: 8px;
}
.article-content h3 { font-size: 1.12em; margin: 28px 0 10px; }
.article-content p { color: var(--muted2); margin-bottom: 18px; font-size: 1.02em; line-height: 1.8; }
.article-content strong { color: var(--text); }
.article-content a { color: var(--green-bright); text-decoration: none; }
.article-content a:hover { text-decoration: underline; }
.article-content ul, .article-content ol { margin: 0 0 18px 24px; color: var(--muted2); }
.article-content li { margin-bottom: 8px; line-height: 1.7; }
.article-content blockquote {
  border-left: 3px solid var(--gold);
  background: var(--surface2);
  border-radius: 0 8px 8px 0;
  padding: 14px 22px;
  margin-bottom: 18px;
  color: var(--muted2);
  font-style: italic;
}
.article-content code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.88em;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 7px;
  color: var(--gold-soft);
}
.article-content pre {
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px 24px;
  overflow-x: auto;
  margin-bottom: 18px;
}
.article-content pre code {
  background: none;
  border: none;
  padding: 0;
  color: var(--text);
  font-size: 0.86em;
  line-height: 1.6;
}
.article-content hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
.article-content table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 0.92em; }
.article-content th, .article-content td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; }
.article-content th { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; color: var(--green); text-transform: uppercase; letter-spacing: 0.05em; }
.article-content td { color: var(--muted2); }

.empty-state, .error-state {
  text-align: center;
  color: var(--muted);
  padding: 60px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.9em;
}
@media (max-width: 860px) {
  .container { padding: 36px max(20px, 4vw) 60px; }
  .post-card { padding: 22px 20px; }
}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">bastiaanvdh_</a>
    <a href="index.html" class="nav-back">← Terug naar portfolio</a>
  </div>
</nav>

<div class="container">

  <div id="list-view">
    <div class="section-label">Blog</div>
    <h1>Analyses & build-logs</h1>
    <p class="intro">Hoe ik naar aandelen kijk, wat ik bouw en wat ik daarvan leer. Verlengstuk van mijn Instagram-kanaal <strong style="color: var(--text);">Beleggen met Bastiaan</strong>. Puur informatief, geen advies.</p>
    <div id="post-list"><div class="empty-state">// posts laden…</div></div>
  </div>

  <div id="article-view">
    <a href="blog.html" class="article-back" onclick="showList(); return false;">← Alle posts</a>
    <div class="article-meta" id="article-meta"></div>
    <div class="article-content" id="article-content"></div>
  </div>

</div>

<script>
var posts = [];

function fmtDate(iso) {
  var maanden = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
  var d = new Date(iso);
  return d.getDate() + ' ' + maanden[d.getMonth()] + ' ' + d.getFullYear();
}

function renderList() {
  var list = document.getElementById('post-list');
  if (!posts.length) {
    list.innerHTML = '<div class="empty-state">// nog geen posts — binnenkort meer</div>';
    return;
  }
  list.innerHTML = '';
  posts.forEach(function (p) {
    var a = document.createElement('a');
    a.className = 'post-card';
    a.href = 'blog.html#' + p.slug;
    a.innerHTML =
      '<div class="post-meta"><span>' + fmtDate(p.date) + '</span>' +
      p.tags.map(function (t) { return '<span class="post-tag">#' + t + '</span>'; }).join('') + '</div>' +
      '<h2>' + p.title + '</h2>' +
      '<p>' + p.summary + '</p>' +
      '<span class="read-more">Lees verder →</span>';
    a.addEventListener('click', function (e) {
      e.preventDefault();
      location.hash = p.slug;
    });
    list.appendChild(a);
  });
}

function showList() {
  history.replaceState(null, '', 'blog.html');
  document.getElementById('article-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function showPost(slug) {
  var post = posts.filter(function (p) { return p.slug === slug; })[0];
  if (!post) { showList(); return; }
  fetch('posts/' + post.file)
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (md) {
      document.getElementById('article-meta').innerHTML =
        fmtDate(post.date) + ' &nbsp;·&nbsp; ' + post.tags.map(function (t) { return '#' + t; }).join(' ') +
        ' &nbsp;·&nbsp; ' + Math.max(1, Math.round(md.split(/\s+/).length / 220)) + ' min leestijd';
      document.getElementById('article-content').innerHTML = marked.parse(md);
      document.getElementById('list-view').style.display = 'none';
      document.getElementById('article-view').style.display = 'block';
      document.title = post.title + ' | Bastiaan van der Horst';
      window.scrollTo(0, 0);
    })
    .catch(function () {
      document.getElementById('article-content').innerHTML = '<div class="error-state">// post kon niet geladen worden</div>';
      document.getElementById('article-view').style.display = 'block';
      document.getElementById('list-view').style.display = 'none';
    });
}

function route() {
  var slug = location.hash.replace('#', '');
  if (slug && posts.length) showPost(slug);
  else if (posts.length) {
    document.getElementById('article-view').style.display = 'none';
    document.getElementById('list-view').style.display = 'block';
  }
}

window.addEventListener('hashchange', route);

fetch('posts/index.json')
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (data) {
    posts = data.posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
    renderList();
    route();
  })
  .catch(function () {
    document.getElementById('post-list').innerHTML = '<div class="error-state">// kon posts/index.json niet laden</div>';
  });
</script>
</body>
</html>
